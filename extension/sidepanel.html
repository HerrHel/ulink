<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__MSG_ext_name__</title>
<style>
  :root {
    --bg: #F5EFEA;
    --surface: #FDFBF9;
    --text: #2C2824;
    --muted: #6A6660;
    --accent: #122E8A;
    --border: #E5DDD3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181D;
      --surface: #1E2128;
      --text: #E8E6E3;
      --muted: #A09C96;
      --accent: #8FA8FF;
      --border: #2E323B;
    }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { display: block; width: 100%; height: 100%; border: 0; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 24px; text-align: center; background: var(--bg); }
  .overlay[hidden] { display: none; }
  .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
    border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 8px; }
  .btn { appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 8px; padding: 6px 14px; font: inherit; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
<iframe id="app" title="__MSG_ext_name__" allow="clipboard-write"></iframe>

<div id="loading" class="overlay" role="status">
  <div class="spinner" aria-hidden="true"></div>
  <div class="muted" data-i18n="panel_loading"></div>
</div>

<div id="offline" class="overlay" hidden>
  <div class="title" data-i18n="panel_offline_title"></div>
  <div class="muted" data-i18n="panel_offline_desc"></div>
  <div class="actions">
    <button id="retry" class="btn" type="button" data-i18n="panel_retry"></button>
    <a id="openSite" class="btn primary" target="_blank" rel="noopener" data-i18n="panel_open_site"></a>
  </div>
</div>

<script type="module" src="sidepanel.js"></script>
</body>
</html>
