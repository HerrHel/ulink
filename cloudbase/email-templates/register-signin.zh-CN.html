<!--
  与链 ulink · 注册/登录验证码邮件模板（中文）
  适配 CloudBase 邮箱登录 EmailTemplateConfig.RegisterSignIn.ZhCN

  ⚠️ 平台按「HTML 片段」处理，不能用整篇文档：
     - 允许 style 块和 table 布局（暗色模式媒体查询可用）
     - 禁止 meta 标签（实测报 template contains forbidden pattern）
     - 也不需要 doctype / html / head / title / body，平台会自己包一层
  ⚠️ 注释闭合符后面不能再跟任何字符：曾写成「闭合符 + 分号」，那个分号被
     当成正文渲染，邮件开头多出一个「；」，通知摘要也被它挤掉了。
  ⚠️ 验证码邮件的主题由平台固定，我们改不了；收件箱列表与系统通知里那行
     「摘要文字」取自正文第一段文本。所以正文最顶部放了一段人眼看不见、
     但客户端能读到的隐藏摘要（preheader），里面写的就是验证码。
-->
<style>
  @media (prefers-color-scheme: dark) {
    .email-bg { background-color: #12100E !important; }
    .card-wrap { background-color: #1C1917 !important; box-shadow: 0 4px 24px rgba(0,0,0,0.4) !important; border: 1px solid #2E2924 !important; }
    .logo-badge { background-color: #26211C !important; border-color: #38312A !important; }
    .title-text { color: #F5EFEA !important; }
    .sub-text { color: #A8A29A !important; }
    .email-highlight { color: #F5EFEA !important; }
    .code-box-td { background-color: #24201C !important; border-color: #443B33 !important; }
    .code-text { color: #60A5FA !important; }
    .hint-text { color: #857F76 !important; }
    .divider-line { border-top-color: #2E2924 !important; }
    .footer-text { color: #736C63 !important; }
    .footer-link { color: #60A5FA !important; }
  }
</style>

<!-- 隐藏摘要（preheader）：正文第一个文本节点，人眼看不到，但客户端的列表
     摘要 / 系统通知会取它，所以验证码放在最前面避免被截断。
     - display:none !important —— Gmail 网页版/Yahoo 会覆盖不带 !important 的规则
     - mso-hide:all —— 挡住 Outlook 的 Word 渲染内核
     - 颜色取背景色 + 1px 字号 —— 万一被转发/回复时样式丢失也不明显漏出
     - 末尾 &#847; 零宽字符 —— 占位，防止正文字符串顶进摘要 -->
<div aria-hidden="true" style="display:none !important;mso-hide:all;max-height:0;max-width:0;overflow:hidden;font-size:1px;line-height:1px;color:#F5EFEA;opacity:0">
  你的与链验证码是 {{.VerificationCode}}，{{.ExpireMinutes}} 分钟内有效。请勿转发给他人。&#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; 
</div>

<table width="100%" cellpadding="0" cellspacing="0" class="email-bg" style="background:#F5EFEA;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;-webkit-font-smoothing:antialiased">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" class="card-wrap" style="max-width:460px;background:#FDFBF9;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.03)">

        <!-- Header / Logo -->
        <tr>
          <td style="padding:40px 40px 0;text-align:center">
            <table cellpadding="0" cellspacing="0" style="margin:0 auto">
              <tr>
                <td align="center" valign="middle" class="logo-badge" style="background:#F5EFEA;width:56px;height:56px;border-radius:16px;text-align:center;vertical-align:middle;border:1px solid #EFE8DF;line-height:0;font-size:0;padding:0;box-shadow:0 2px 8px rgba(0,0,0,0.03)">
                  <a href="https://ulink.ren" target="_blank" style="text-decoration:none;display:inline-block;line-height:0;font-size:0;vertical-align:middle">
                    <img src="https://ulink.ren/logo.png" width="40" height="40" alt="与链 ulink" style="display:block;margin:0 auto;border:0;line-height:0" />
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Title -->
        <tr>
          <td class="title-text" style="padding:18px 40px 6px;font-size:21px;font-weight:700;color:#2C2824;text-align:center;letter-spacing:-0.02em">
            与链 ulink 验证码
          </td>
        </tr>

        <!-- Subtitle -->
        <tr>
          <td class="sub-text" style="padding:0 40px 24px;font-size:14px;color:#6A6660;text-align:center;line-height:1.6">
            你的登录邮箱：<strong class="email-highlight" style="color:#2C2824;font-weight:600">{{.Email}}</strong>
          </td>
        </tr>

        <!-- Code box -->
        <tr>
          <td style="padding:0 40px 24px;text-align:center">
            <table cellpadding="0" cellspacing="0" style="margin:0 auto">
              <tr>
                <td align="center" valign="middle" class="code-box-td code-text" style="background:#F8F3ED;border:1.5px dashed #D5CBBE;border-radius:14px;padding:16px 28px 16px 38px;font-size:32px;font-weight:700;font-family:'JetBrains Mono','SF Mono',Consolas,Menlo,monospace;color:#122E8A;letter-spacing:10px;text-align:center">
                  {{.VerificationCode}}
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Hint -->
        <tr>
          <td class="hint-text" style="padding:0 40px 28px;font-size:13px;color:#8F8A82;text-align:center;line-height:1.6">
            验证码 {{.ExpireMinutes}} 分钟内有效，请勿转发给他人。<br>如非本人操作，请忽略此邮件。
          </td>
        </tr>

        <!-- Divider -->
        <tr>
          <td style="padding:0 40px">
            <table width="100%" cellpadding="0" cellspacing="0"><tr>
              <td class="divider-line" style="border-top:1px solid #EFE8DF;line-height:0;font-size:0">&nbsp;</td>
            </tr></table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td class="footer-text" style="padding:20px 40px 32px;font-size:12px;color:#A8A29A;text-align:center;line-height:1.6">
            与链 (ulink) · 全能型单页书签管理器<br>
            <a href="https://ulink.ren" target="_blank" class="footer-link" style="color:#122E8A;text-decoration:none;font-weight:500">ulink.ren</a>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
