<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#F5EFEA;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#F5EFEA;padding:40px 0">
  <tr>
    <td align="center">
      <table width="480" cellpadding="0" cellspacing="0" style="background:#FDFBF9;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.06)">

        <!-- Header -->
        <tr>
          <td style="padding:36px 40px 0;text-align:center">
            <table cellpadding="0" cellspacing="0" style="margin:0 auto">
              <tr>
                <td style="background:linear-gradient(135deg,#122E8A,#1E40AF);width:52px;height:52px;border-radius:15px;text-align:center;vertical-align:middle">
                  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
                  </svg>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Title -->
        <tr>
          <td style="padding:20px 40px 8px;font-size:22px;font-weight:700;color:#2C2824;text-align:center;font-family:'Clash Display',system-ui,sans-serif">
            LinkVault 登录验证
          </td>
        </tr>

        <!-- Subtitle -->
        <tr>
          <td style="padding:0 40px 24px;font-size:14px;color:#6A6660;text-align:center;line-height:1.6">
            你的登录邮箱：<strong style="color:#2C2824">{{ .Email }}</strong>
          </td>
        </tr>

        <!-- Code box -->
        <tr>
          <td style="padding:0 40px 28px;text-align:center">
            <table cellpadding="0" cellspacing="0" style="margin:0 auto">
              <tr>
                <td style="background:#F8F3ED;border:1.5px dashed #D5CBBE;border-radius:12px;padding:20px 36px;font-size:32px;font-weight:700;font-family:'JetBrains Mono','SF Mono',monospace;color:#122E8A;letter-spacing:10px;text-align:center">
                  {{ .Token }}
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Hint -->
        <tr>
          <td style="padding:0 40px 28px;font-size:13px;color:#9B968E;text-align:center;line-height:1.6">
            验证码 10 分钟内有效，请勿转发给他人。<br>如果未请求登录，请忽略此邮件。
          </td>
        </tr>

        <!-- Divider -->
        <tr>
          <td style="padding:0 40px">
            <table width="100%" cellpadding="0" cellspacing="0"><tr>
              <td style="border-top:1px solid #EFE8DF;line-height:0"></td>
            </tr></table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:18px 40px 28px;font-size:12px;color:#B0A99E;text-align:center;line-height:1.6">
            LinkVault · 全能型书签管理工具<br>
            <a href="{{ .SiteURL }}" style="color:#122E8A;text-decoration:none">{{ .SiteURL }}</a>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
