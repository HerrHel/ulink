# 一次性：清理静态托管里 `--safe` 部署历次留下的 .cloudbase-backup/ 备份
# 只能手动触发。默认只统计；mode=delete 且 confirm 填 DELETE 才会真的删。
# 只动 .cloudbase-backup/ 前缀，不影响线上网站文件。清理完成后可删除本 workflow 与脚本。
name: cleanup-hosting-backup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run 只统计；delete 删除'
        type: choice
        options: [dry-run, delete]
        default: dry-run
      confirm:
        description: 'mode=delete 时必须填 DELETE'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 与部署共用并发组，避免和正在进行的部署同时操作同一个桶
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      ENV_ID: ulink-d1g5srvjo54b1886a
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: 清理备份
        env:
          CLOUDBASE_APIKEY: ${{ secrets.CLOUDBASE_APIKEY }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$MODE" = "delete" ]; then
            if [ "$CONFIRM" != "DELETE" ]; then
              echo "::error::删除模式需要在 confirm 中填 DELETE"
              exit 1
            fi
            node scripts/cleanup-hosting-backup.mjs --delete
          else
            node scripts/cleanup-hosting-backup.mjs
          fi
