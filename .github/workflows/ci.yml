name: CI
on:
  push:
    branches-ignore: ["main"]
  pull_request:
    branches: ["**"]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      # tiptap 全家桶已统一到 3.29.2（见 chore/tiptap-3.29.2），strict peer 解析下
      # npm ci 无 ERESOLVE，不再需要 --legacy-peer-deps。
      - run: npm ci
      - name: Lint
        run: npm run lint
      # F2-006：类型检查进入门禁
      - name: Typecheck
        run: npm run typecheck
      - name: Unit Tests
        run: npm run test
      # F2-001：audit 必须 blocking；豁免请用正式 allowlist，禁止 || true 吞错
      - name: Dependency Audit
        run: npm audit --omit=dev --audit-level=high
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # C1-002 / F2-002：Playwright 进入 PR 门禁
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E Tests
        run: npm run test:e2e
        env:
          CI: true
  # 后端门禁：本地栈应用迁移 + pgTAP 断言（防 018 型「history applied ≠ 实际 schema」事故）。
  # 跑 supabase/tests/database.test.sql，与前端 lint/typecheck/test 并行、同属 PR 门禁。
  supabase-db-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # 官方镜像自带 pgTAP；本地栈不连远程库，无需任何 secrets（CI 无 SUPABASE_* 也可跑）
      - name: Start Supabase local stack
        run: supabase start
      - name: Apply migrations
        run: supabase db reset
      - name: Run pgTAP tests
        run: supabase db test
