name: CI
on:
  push:
    branches-ignore: ["main"]
  pull_request:
    branches: ["**"]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      # tiptap 单包升级后 peer 与 starter-kit 不同小版本（@tiptap/extensions 3.28 vs
      # extension-placeholder/task-list 3.29），严格 peer 解析下 npm ci 报 ERESOLVE。
      # 配置层兼容可用 --legacy-peer-deps 通过（build/test 均绿）；统一升级全家桶另开分支。
      - run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      # F2-006：类型检查进入门禁
      - name: Typecheck
        run: npm run typecheck
      - name: Unit Tests
        run: npm run test
      # F2-001：audit 必须 blocking；豁免请用正式 allowlist，禁止 || true 吞错
      - name: Dependency Audit
        run: npm audit --omit=dev --audit-level=high
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      # C1-002 / F2-002：Playwright 进入 PR 门禁
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E Tests
        run: npm run test:e2e
        env:
          CI: true
