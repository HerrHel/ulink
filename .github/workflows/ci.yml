name: CI
on:
  # main 必须进门禁：此前 branches-ignore: ["main"] 让直推 main 完全跳过检查
  # （185b4499/c6db8f68 两提交即零 CI 保护直入 main）。main 是实际集成分支，
  # 直推无 PR 保护时本工作流是唯一防线，故全分支触发。
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # 手动触发：用于重新部署（如线上被旧版本覆盖）或单纯验证部署链路，无代码变更也能跑
  workflow_dispatch:
# 最小权限：所有 job 只需要读仓库。写权限一律不授予，
# 降低供应链投毒（恶意依赖在 CI 内执行）后可造成的破坏面。
permissions:
  contents: read
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      # tiptap 全家桶已统一到 3.29.2（见 chore/tiptap-3.29.2），strict peer 解析下
      # npm ci 无 ERESOLVE，不再需要 --legacy-peer-deps。
      - run: npm ci
      - name: Lint
        run: npm run lint
      # 独立覆盖 e2e/ 与 scripts/（默认 lint 只扫 src/）：no-undef 硬拦，存量风格仅 warn
      - name: Lint (e2e & scripts)
        run: npm run lint:scripts
      # F2-006：类型检查进入门禁（现串联主 tsconfig 与 e2e/config 专用 tsconfig.e2e.json）
      - name: Typecheck
        run: npm run typecheck
      - name: Unit Tests
        run: npm run test
      # CloudBase 形态定向单测：默认套件 VITE_BACKEND='' 使 isCloudBaseBackend()===true
      # 分支在 CI 零执行，这里用独立配置单独跑一组契约子集补齐盲区。
      - name: Unit Tests (CloudBase)
        run: npm run test:cloudbase
      # F2-001：audit 必须 blocking；豁免请用正式 allowlist，禁止 || true 吞错。
      # 拆两步：原 --omit=dev --audit-level=high 放过整条 dev 工具链漏洞与 prod moderate，
      # 现分别覆盖 full tree high+ 与 生产依赖 moderate+。
      # 生产依赖必须零 high/moderate：这些会随 dist 发布，是真正的供应链面。
      - name: Dependency Audit (prod-only, blocking)
        run: npm audit --omit=dev --audit-level=moderate
      # dev 工具链（vitest / @cloudbase/manager-node 的传递依赖）有已知 high 漏洞，
      # 但不进入生产产物，且 decode-uri-component 的修复需要 breaking 升级部署 CLI。
      # 保留可见性、不阻塞发布；清单与处置计划见 docs/TECH_DEBT.md「依赖」一节。
      - name: Dependency Audit (dev toolchain, advisory)
        run: npm audit --audit-level=high || echo "::warning::dev 工具链存在已知漏洞（不进入生产产物），见 docs/TECH_DEBT.md"
      # 派生 JS 资产一致性守卫：由 TS 真源重新生成派生资产，若与提交产物有 diff
      # （手改/漏跑生成器）立即红灯，杜绝部署漂移版本。diff 范围必须覆盖 build-fn-assets.mjs
      # 的**全部**产出：此前只盯 cloudbase/functions，scripts/video-worker/video-platforms.json
      # 也是从 src/config/videoPlatforms.json 复制的派生资产，漂移不在守卫范围内（审计 #26）。
      - name: Derived fn assets (no drift)
        run: node scripts/build-fn-assets.mjs && git diff --exit-code -- cloudbase/functions scripts/video-worker/video-platforms.json
      # 生产构建进入门禁验证（提前捕获构建期错误），产物供 deploy 复用，避免重复构建
      - name: Build
        run: npm run build
      - name: Upload build dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 1
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # 非阻塞诊断：vite.config 依赖 marked。注意 marked v18 的 exports 不导出
      # package.json，`require('marked/package.json')` 会假性报缺失 —— 用动态 import 判断。
      - name: Verify build deps present
        run: |
          ls -d node_modules/marked 2>/dev/null || echo "::warning::node_modules/marked 目录不存在"
          node -e "import('marked').then(()=>console.log('marked dynamic import OK')).catch(e=>console.log('marked import failed:', e.code))"
      # C1-002 / F2-002：Playwright 进入 PR 门禁；缓存 Chromium 运行时避免每次全量下载
      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        # 缓存命中时浏览器二进制已在 ~/.cache/ms-playwright；runner 镜像自带浏览器系统库，
        # 再跑 --with-deps 只会无谓触发 apt，把整轮 CI 绑死在 Ubuntu 镜像的 DNS 上
        # （2026-11-12 就因 archive/security.ubuntu.com 解析失败挂了 10 分钟）。
        # 只有缓存未命中（playwright 版本变化）才需要装系统依赖；命中时先做启动冒烟，
        # 万一镜像缺库再回退 --with-deps，不赌「依赖一定齐全」。
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            npx playwright install chromium
            if ! node -e "import('playwright').then(async ({chromium}) => { const b = await chromium.launch({headless:true}); await b.close() }).catch(e => { console.error(e); process.exit(1) })"; then
              echo '::warning::缓存命中但系统库缺失，回退到 --with-deps'
              npx playwright install --with-deps chromium
            fi
          else
            npx playwright install --with-deps chromium
          fi
      - name: E2E Tests
        run: npm run test:e2e
        env:
          CI: true
      # test:e2e:prod（PurgeCSS/minify 回归）此前从未进 CI：默认 test:e2e 走 dev server，
      # 复现不了仅生产构建生效的问题。LV_E2E_PROD=1 让 webServer 改走 build + preview，
      # 只跑 app / landing 两个核心文件控制耗时（全量 prod 太慢）。
      - name: E2E Tests (prod build)
        run: npx playwright test e2e/app.spec.ts e2e/landing.spec.ts --config playwright.config.ts
        env:
          CI: true
          LV_E2E_PROD: '1'
  # 「后端门禁」原为 supabase-db-test（本地栈 + pgTAP），已于 2026-10-27 移除：
  #   生产后端已于 2026-10-22 全量切到 CloudBase，Supabase 只剩历史迁移源的身份，
  #   起本地栈跑 pgTAP 验证的是**已不再使用的**那套 schema，对现网无保护作用，
  #   却是每次 CI 里最慢的一环。相关断言文件仍归档在 supabase/tests/（见其 README）。
  #   CloudBase 侧的迁移校验请用 `bash <tcb> db execute` 核对实际 schema。

  # ── 部署：测试全绿才发布到 CloudBase 静态托管 ──
  #
  # 为什么不直接用 CloudBase 控制台的「Git 平台部署」：
  #   它只执行 `npm run build`，**不跑任何测试** —— 等于绕过 lint/typecheck/
  #   5000+ 单测/e2e/audit 全部门禁，任何一次 push 都能把有问题的代码送上生产。
  #   这里用 needs 把两个门禁 job 作为前置，测试不过就绝不发布。
  #
  # 与手动 `tcb hosting deploy` 互斥：Git 部署每次 push 都会发布，
  # 再手动传一次会把线上覆盖成旧版本。统一走本 job。
  deploy:
    needs: [lint-test, e2e]
    # push 与手动触发都可发布，但都限定 main（PR 与其它分支绝不发布）
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # CLOUDBASE_APIKEY 是部署唯一的长期凭据。建议在仓库 Settings → Environments 建
    # 一个 production 环境并设为本 job 的 environment，开启 required reviewers：
    # 这样即使 CI 内某依赖被投毒，也无法在无人审批的情况下直接取到密钥。
    env:
      ENV_ID: ulink-d1g5srvjo54b1886a
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # 复用 lint-test 构建并经测试验证的产物，免去重复 npm ci 和 build
      - name: Download build dist
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist
      - name: Deploy to CloudBase hosting
        env:
          CLOUDBASE_APIKEY: ${{ secrets.CLOUDBASE_APIKEY }}
        run: |
          if [ -z "$CLOUDBASE_APIKEY" ]; then
            # 缺 key 必须显式失败，不能 exit 0 假绿（否则 CI 全绿却从未部署）
            echo "::error::未配置 CLOUDBASE_APIKEY，无法部署"
            exit 1
          fi
          # ⚠️ 必须用 -p 显式指定可执行文件：@cloudbase/cli 暴露了三个 bin
          # （tcb / cloudbase / cloudbase-mcp），直接 `npx @cloudbase/cli` 会报
          # "could not determine executable to run"。
          CLI="npx --yes -p @cloudbase/cli tcb"

          # ── 诊断（只输出长度与前缀，不泄露密钥本体）──
          # JWT 固定以 eyJ 开头；轮换后长度会变，不再校验总长度，只查前缀与复制污染。
          echo "::notice::API Key 长度=${#CLOUDBASE_APIKEY} 前缀=${CLOUDBASE_APIKEY:0:3}（预期前缀=eyJ）"
          case "$CLOUDBASE_APIKEY" in
            eyJ*) : ;;
            *) echo "::error::API Key 前缀异常，应以 eyJ 开头（JWT）；请重新完整复制"; exit 1 ;;
          esac
          # 常见污染：带上了变量名、引号、换行/空白，或复制了整行输出
          case "$CLOUDBASE_APIKEY" in
            *CLOUDBASE_APIKEY*|*\ *|*\"*|*\'*)
              echo "::error::API Key 含变量名/引号/空白，请只复制值本身"; exit 1 ;;
          esac

          # --cloudbase-api-key 支持非交互认证，无需设备码。
          # CloudBase 鉴权偶发 "Authorization was not completed"（2026-11-12 整轮 CI
          # 因此变红、重跑即通过），给 3 次机会，避免瞬时抖动卡掉「测试全绿」的发布。
          login_ok=0
          for attempt in 1 2 3; do
            echo "::group::CloudBase login (attempt ${attempt}/3)"
            if $CLI login --cloudbase-api-key "$CLOUDBASE_APIKEY" -e "$ENV_ID"; then
              login_ok=1
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          if [ "$login_ok" -ne 1 ]; then
            echo "::error::CloudBase 登录连续 3 次失败"
            exit 1
          fi
          # --safe：发布前备份，上传失败自动回滚（省去跨洋 --verify 哈希对比耗时）
          $CLI hosting deploy ./dist -e "$ENV_ID" --safe
      # 部署后校验线上实际版本：带时间戳穿透缓存，比对 version.json.commit 与本次
      # github.sha，杜绝「CI 全绿但线上仍是旧版本」（CDN 传播有秒级延迟，故少量重试）
      - name: Verify deployed version
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3; do
            URL="https://ulink.ren/version.json?t=$(date +%s)"
            RESPONSE=$(curl -fsSL "$URL" 2>/dev/null) || RESPONSE=""
            DEPLOYED_SHA=$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const c=JSON.parse(s).commit;if(typeof c==='string')process.stdout.write(c)}catch(e){}})")
            if [ -n "$DEPLOYED_SHA" ] && [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
              echo "::notice::线上版本校验通过：$DEPLOYED_SHA（第 $attempt 次）"
              exit 0
            fi
            echo "::warning::第 $attempt 次线上版本未匹配（期望 $EXPECTED_SHA，实际 ${DEPLOYED_SHA:-无}）"
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          echo "::error::线上 version.json commit 与本次提交不一致：期望 $EXPECTED_SHA，实际 ${DEPLOYED_SHA:-无}；线上可能仍是旧版本"
          exit 1
