name: CI
on:
  # main 必须进门禁：此前 branches-ignore: ["main"] 让直推 main 完全跳过检查
  # （185b4499/c6db8f68 两提交即零 CI 保护直入 main）。main 是实际集成分支，
  # 直推无 PR 保护时本工作流是唯一防线，故全分支触发。
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # 手动触发：用于重新部署（如线上被旧版本覆盖）或单纯验证部署链路，无代码变更也能跑
  workflow_dispatch:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      # tiptap 全家桶已统一到 3.29.2（见 chore/tiptap-3.29.2），strict peer 解析下
      # npm ci 无 ERESOLVE，不再需要 --legacy-peer-deps。
      - run: npm ci
      - name: Lint
        run: npm run lint
      # F2-006：类型检查进入门禁
      - name: Typecheck
        run: npm run typecheck
      - name: Unit Tests
        run: npm run test
      # F2-001：audit 必须 blocking；豁免请用正式 allowlist，禁止 || true 吞错
      - name: Dependency Audit
        run: npm audit --omit=dev --audit-level=high
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # C1-002 / F2-002：Playwright 进入 PR 门禁
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E Tests
        run: npm run test:e2e
        env:
          CI: true
  # 后端门禁：本地栈应用迁移 + pgTAP 断言（防 018 型「history applied ≠ 实际 schema」事故）。
  # 跑 supabase/tests/database.test.sql，与前端 lint/typecheck/test 并行、同属 PR 门禁。
  supabase-db-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # 官方镜像自带 pgTAP；本地栈不连远程库，无需任何 secrets（CI 无 SUPABASE_* 也可跑）
      - name: Start Supabase local stack
        run: supabase start
      - name: Apply migrations
        run: supabase db reset
      - name: Run pgTAP tests
        run: supabase db test

  # ── 部署：测试全绿才发布到 CloudBase 静态托管 ──
  #
  # 为什么不直接用 CloudBase 控制台的「Git 平台部署」：
  #   它只执行 `npm run build`，**不跑任何测试** —— 等于绕过 lint/typecheck/
  #   5000+ 单测/e2e/audit 全部门禁，任何一次 push 都能把有问题的代码送上生产。
  #   这里用 needs 把两个门禁 job 作为前置，测试不过就绝不发布。
  #
  # 与手动 `tcb hosting deploy` 互斥：Git 部署每次 push 都会发布，
  # 再手动传一次会把线上覆盖成旧版本。统一走本 job。
  deploy:
    needs: [lint-test, e2e]
    # push 与手动触发都可发布，但都限定 main（PR 与其它分支绝不发布）
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      ENV_ID: ulink-d1g5srvjo54b1886a
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # 生产构建自动加载仓库内的 .env.production（含 VITE_BACKEND=cloudbase 等）
      - name: Build
        run: npm run build
      - name: Deploy to CloudBase hosting
        env:
          CLOUDBASE_APIKEY: ${{ secrets.CLOUDBASE_APIKEY }}
        run: |
          if [ -z "$CLOUDBASE_APIKEY" ]; then
            echo "::warning::未配置 CLOUDBASE_APIKEY，跳过部署（门禁仍照常执行）"
            exit 0
          fi
          # --cloudbase-api-key 支持非交互认证，无需设备码
          npx --yes @cloudbase/cli login --cloudbase-api-key "$CLOUDBASE_APIKEY" -e "$ENV_ID"
          # --safe：发布前备份，上传或校验失败自动回滚
          # --verify：上传后校验远端文件与本地产物一致
          npx --yes @cloudbase/cli hosting deploy ./dist -e "$ENV_ID" --safe --verify
