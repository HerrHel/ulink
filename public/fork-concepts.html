<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>与链 ulink — 创作与分享「4套全新顶级概念」交互预览</title>
<style>
  :root {
    --bg: #F5EFEA;
    --surface: #FDFBF9;
    --border: #E5DDD3;
    --border-hover: #D5CBBE;
    --ink: #2C2824;
    --ink-2: #6A6660;
    --ink-3: #9B968E;
    --brand: #122E8A;
    --accent: #3B82F6;
    --emerald: #10B981;
    --mint: #34D399;
    --radius: 16px;
    --shadow-sm: 0 2px 8px rgba(44, 40, 36, 0.05);
    --shadow-md: 0 8px 24px rgba(44, 40, 36, 0.08);
  }

  [data-theme="dark"] {
    --bg: #1A1A1D;
    --surface: #25252B;
    --border: #2F2F36;
    --border-hover: #3D3D46;
    --ink: #EEE9E2;
    --ink-2: #9B968E;
    --ink-3: #6A6660;
    --brand: #F04A8A;
    --accent: #60A5FA;
    --emerald: #34D399;
    --mint: #6EE7B7;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 60px;
    transition: background 0.3s, color 0.3s;
    user-select: none;
  }

  .header {
    text-align: center;
    max-width: 820px;
    margin-bottom: 24px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--emerald);
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.25);
    padding: 3px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: clamp(1.6rem, 3.5vw, 2.2rem);
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 10px;
  }
  p.desc {
    font-size: 0.95rem;
    color: var(--ink-2);
    line-height: 1.65;
  }

  /* 顶部导航与控制栏 */
  .control-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 24px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 4px;
    border-radius: 999px;
    box-shadow: var(--shadow-sm);
  }
  .tab-btn {
    border: none;
    background: transparent;
    padding: 8px 18px;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--ink-2);
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active {
    background: var(--brand);
    color: #FFFFFF;
    box-shadow: 0 2px 8px rgba(18, 46, 138, 0.25);
  }
  [data-theme="dark"] .tab-btn.active {
    box-shadow: 0 2px 8px rgba(240, 74, 138, 0.35);
  }

  .theme-toggle {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-2);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s;
  }
  .theme-toggle:hover {
    color: var(--ink);
    border-color: var(--border-hover);
  }

  /* 主舞台卡片容器 */
  .stage-card {
    width: 100%;
    max-width: 980px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .canvas-wrap {
    position: relative;
    width: 100%;
    height: 440px;
    background: radial-gradient(circle at center, rgba(255, 255, 255, 0.9) 0%, rgba(245, 239, 234, 0.4) 100%);
    cursor: pointer;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  [data-theme="dark"] .canvas-wrap {
    background: radial-gradient(circle at center, #23232A 0%, #17171B 100%);
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  /* 悬浮交互提示 */
  .floating-hud {
    position: absolute;
    top: 14px;
    left: 18px;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.72rem;
    color: var(--ink-2);
  }
  .hud-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--emerald);
    box-shadow: 0 0 8px var(--emerald);
    animation: hud-pulse 1.8s ease-in-out infinite;
  }
  @keyframes hud-pulse {
    0%, 100% { opacity: 0.5; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  .action-hint {
    position: absolute;
    bottom: 14px;
    right: 18px;
    pointer-events: none;
    font-size: 0.78rem;
    color: var(--ink-2);
    background: rgba(255, 255, 255, 0.7);
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid rgba(0, 0, 0, 0.05);
    backdrop-filter: blur(8px);
  }
  [data-theme="dark"] .action-hint {
    background: rgba(37, 37, 43, 0.75);
    border-color: rgba(255, 255, 255, 0.08);
  }

  /* 底部理念说明面板 */
  .meta-panel {
    padding: 24px 28px;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 24px;
    align-items: center;
  }
  @media (max-width: 720px) {
    .meta-panel { grid-template-columns: 1fr; gap: 16px; }
  }

  .meta-info h3 {
    font-size: 1.18rem;
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .meta-tag {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(16, 185, 129, 0.1);
    color: var(--emerald);
  }
  .meta-info p {
    font-size: 0.88rem;
    color: var(--ink-2);
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .feature-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--ink);
  }
  .feature-list li {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .feature-list li i {
    color: var(--emerald);
    font-style: normal;
    font-weight: 700;
  }

  .cta-box {
    background: rgba(0, 0, 0, 0.025);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  [data-theme="dark"] .cta-box {
    background: rgba(255, 255, 255, 0.02);
  }
  .cta-box .tip-title {
    font-size: 0.84rem;
    font-weight: 700;
    color: var(--ink);
  }
  .cta-box .tip-body {
    font-size: 0.78rem;
    color: var(--ink-2);
    line-height: 1.5;
  }
  .apply-btn {
    border: none;
    background: var(--emerald);
    color: #FFFFFF;
    font-size: 0.84rem;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    align-self: flex-start;
    transition: opacity 0.2s, transform 0.1s;
  }
  .apply-btn:hover { opacity: 0.9; }
  .apply-btn:active { transform: scale(0.97); }
</style>
</head>
<body>

  <div class="header">
    <div class="eyebrow">Visual R&D Laboratory</div>
    <h1>创作与分享：4套全新顶级概念探索</h1>
    <p class="desc">摒弃杂乱网状折线与单薄图表，以纯粹光学、三维拓扑几何、磁吸数字实体及深空信标重塑「以链会友 · 知识自由 Fork」的视觉灵魂。</p>
  </div>

  <div class="control-bar">
    <div class="tabs" role="tablist">
      <button class="tab-btn active" onclick="switchConcept(1)">方案 ① 白水晶棱镜与色散分光</button>
      <button class="tab-btn" onclick="switchConcept(2)">方案 ② 量子链接胶囊与光纤流转</button>
      <button class="tab-btn" onclick="switchConcept(3)">方案 ③ 磁悬浮卡片与细胞级抽离</button>
      <button class="tab-btn" onclick="switchConcept(4)">方案 ④ 多端协同光标与隔空投送</button>
    </div>

    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span>
      <span id="theme-text">深色模式</span>
    </button>
  </div>

  <div class="stage-card">
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="concept-canvas"></canvas>
      <div class="floating-hud">
        <span class="hud-dot"></span>
        <span id="hud-mode">CONCEPT // 01 · PRISMATIC_REFRACTION</span>
      </div>
      <div class="action-hint" id="action-hint">
        ⚡ 晃动鼠标扰动光路 · 点击画布激发「棱镜分光脉冲」
      </div>
    </div>

    <div class="meta-panel">
      <div class="meta-info" id="meta-info">
        <!-- 动态注入说明 -->
      </div>
      <div class="cta-box" id="cta-box">
        <!-- 动态注入特点与操作 -->
      </div>
    </div>
  </div>

  <script>
    var canvas = document.getElementById('concept-canvas');
    var ctx = canvas.getContext('2d');
    var wrap = document.getElementById('canvas-wrap');

    var currentConcept = 1;
    var W = 0, H = 0, DPR = 1;
    var clock = 0, lastT = 0;
    var pointer = { x: -1000, y: -1000, tx: 0, ty: 0, active: false };

    var CONCEPTS_META = {
      1: {
        title: '方案 ①：白水晶棱镜与色散分光 (Prism Dispersion)',
        tag: '纯粹光学 · 极简通透',
        desc: '将创作者的知识聚合为一道深蓝纯净激光，射入中枢悬浮自转的三维高透白水晶棱镜。棱镜发生菲涅尔折射与色散，将单色原稿散射分化为 3 条极光光谱带注入本地晶核，象征一条链接散射出多维本地副本。',
        features: [
          '【绝无杂音】：没有密密麻麻的卡片骨架与图表，只有纯粹晶莹的物理折射光影',
          '【光随心动】：鼠标移动三维偏转棱镜，色散光路实时重构运算',
          '【高能脉冲】：点击爆发 Prism Flare 全反射闪光，激发出极光共振光环'
        ],
        hint: '⚡ 晃动鼠标偏转棱镜 · 点击画布激发「棱镜全反射色散脉冲」',
        hud: 'CONCEPT // 01 · PRISMATIC_DISPERSION'
      },
      2: {
        title: '方案 ②：量子链接胶囊与光纤流转 (Quantum Conduit Ingestion)',
        tag: '数字管道 · 链接即达',
        desc: '以 Stripe Link / Raycast Share 为灵感。左侧浮空毛玻璃 URL 胶囊（ulink.ren/s/8f2a）带呼吸指示灯，一条高阶贝塞尔柔性光纤管线横跨空间贯注至右侧本地保险库卡槽。点击胶囊瞬间爆发极速高能光子脉冲，轰击右侧卡槽平滑展开为精致完整的书签组。',
        features: [
          '【真实产品隐喻】：极速还原“一条公开链接，点击即刻通过高速信道载入本地”体验',
          '【光纤流体美学】：悬浮贝塞尔光纤随鼠标重力弹性弯曲，光子微粒匀速穿梭',
          '【高能激光弹道】：点击发射带彗星拖尾的能量激光弹，落地瞬间展开成组'
        ],
        hint: '⚡ 晃动鼠标弯曲光纤 · 点击胶囊发射「高能光子流经光纤管道入库」',
        hud: 'CONCEPT // 02 · QUANTUM_CONDUIT'
      },
      3: {
        title: '方案 ③：磁悬浮卡片与细胞级抽离 (Magnetic Deck Slide)',
        tag: '数字实体 · 丝滑触感',
        desc: '致敬 Apple / Stripe 的数字实体手感。真实 2.5D 磨砂玻璃卡片层叠悬浮，带精美微雕微标。点击时伴随真实的弹簧阻尼物理动画，底层副本卡片如丝绸般抽离滑出，瞬间在表面压印出翡翠立体印章。',
        features: [
          '【扣紧产品】：直观展示卡片形态，但完全告别了简陋的线框与杂线',
          '【弹簧动力学】：真实的物理阻尼回弹，卡片抽离吸附手感极佳',
          '【晶莹盖章】：滑动定型瞬间伴随微粒爆炸与立体压印徽章生成'
        ],
        hint: '⚡ 移动鼠标体验 3D 视差 · 点击触发「弹簧阻尼卡牌抽离 Fork」',
        hud: 'CONCEPT // 03 · MAGNETIC_DECK_SLIDE'
      },
      4: {
        title: '方案 ④：多端协同光标与隔空投送 (Multiplayer Cursors & AirDrop)',
        tag: '以链会友 · 社交协同',
        desc: '将“以链会友”升华为全景协同体验。中心悬浮公开书签组，周围有来自全球的模拟协同光标（东京 @Alex、柏林 @Elena）平滑漫游巡视。你的光标靠近即拉扯出磁力丝线；点击画布释放环形 AirDrop 震荡波，卡牌瞬间分裂出副本隔空吸附投送入库！',
        features: [
          '【临场感十足】：自主平滑漫游的多访客光标，让单机管理变为活力社区',
          '【隔空投送动效】：点击激荡出 Apple AirDrop 风格的同心光环共振波',
          '【精准呼应文案】：将孤立的书签收藏赋予“以链会友、彼此启发”的温度'
        ],
        hint: '⚡ 靠近中心感受磁引力 · 点击舞台触发「AirDrop 隔空投送克隆」',
        hud: 'CONCEPT // 04 · MULTIPLAYER_AIRDROP'
      }
    };

    function updateMeta() {
      var m = CONCEPTS_META[currentConcept];
      document.getElementById('hud-mode').textContent = m.hud;
      document.getElementById('action-hint').textContent = m.hint;

      var infoHtml = 
        '<h3>' + m.title + ' <span class="meta-tag">' + m.tag + '</span></h3>' +
        '<p>' + m.desc + '</p>' +
        '<ul class="feature-list">' +
          m.features.map(function(f) { return '<li><i>✦</i><span>' + f + '</span></li>'; }).join('') +
        '</ul>';
      document.getElementById('meta-info').innerHTML = infoHtml;

      var ctaHtml = 
        '<div class="tip-title">体验此方案在主站的落地效果</div>' +
        '<div class="tip-body">可随时选择将此方案作为宣传落地页的正式「创作与分享」视觉。</div>' +
        '<button class="apply-btn" onclick="applyAsMainVisual(' + currentConcept + ')">设为正式视觉方案</button>';
      document.getElementById('cta-box').innerHTML = ctaHtml;
    }

    function switchConcept(index) {
      currentConcept = index;
      var btns = document.querySelectorAll('.tab-btn');
      btns.forEach(function(b, i) {
        b.classList.toggle('active', i + 1 === index);
      });
      updateMeta();
      resetConceptStates();
    }

    function toggleTheme() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-icon').textContent = isDark ? '🌙' : '☀️';
      document.getElementById('theme-text').textContent = isDark ? '深色模式' : '浅色模式';
    }

    function isDark() {
      return document.documentElement.getAttribute('data-theme') === 'dark';
    }

    function drawRoundRect(c, x, y, w, h, r) {
      c.beginPath();
      if (c.roundRect) {
        c.roundRect(x, y, w, h, r);
      } else {
        c.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
        c.arc(x + w - r, y + r, r, Math.PI * 1.5, Math.PI * 2);
        c.arc(x + w - r, y + h - r, r, 0, Math.PI * 0.5);
        c.arc(x + r, y + h - r, r, Math.PI * 0.5, Math.PI);
        c.closePath();
      }
    }

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = wrap.clientWidth;
      H = wrap.clientHeight;
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    wrap.addEventListener('pointermove', function(e) {
      var r = canvas.getBoundingClientRect();
      pointer.x = e.clientX - r.left;
      pointer.y = e.clientY - r.top;
      pointer.tx = (pointer.x - W * 0.5) / (W * 0.5);
      pointer.ty = (pointer.y - H * 0.5) / (H * 0.5);
      pointer.active = true;
    });
    wrap.addEventListener('pointerleave', function() {
      pointer.active = false;
      pointer.tx = 0;
      pointer.ty = 0;
    });
    wrap.addEventListener('click', function() {
      triggerCurrentAction();
    });

    /* ═══════════════════════════════════════════════════════════
       各方案特有状态与交互逻辑
       ═══════════════════════════════════════════════════════════ */

    // 方案 1 状态（棱镜色散）
    var prismPulse = 0;
    var prismPhotons = [];
    for (var p = 0; p < 18; p++) {
      prismPhotons.push({
        stage: p < 6 ? 0 : (p % 3) + 1, // 0: 入射, 1,2,3: 三道色散出射
        t: Math.random(),
        speed: 0.006 + Math.random() * 0.008,
        size: 2.2 + Math.random() * 1.5
      });
    }

    // 方案 2 状态（量子链接胶囊与光纤流转）
    var capsuleState = {
      animProgress: 0,
      targetProgress: 0,
      burstT: -1,
      burstFlash: 0
    };
    var conduitPhotons = [];
    for (var cp = 0; cp < 14; cp++) {
      conduitPhotons.push({
        t: Math.random(),
        speed: 0.005 + Math.random() * 0.007,
        size: 1.8 + Math.random() * 1.4,
        hue: Math.random() > 0.4 ? 'green' : 'blue'
      });
    }

    // 方案 3 状态（磁悬浮卡片抽离）
    var cardSlide = 0;
    var cardTargetSlide = 0;
    var cardStamped = false;

    // 方案 4 状态（多端协同光标与隔空投送）
    var multiplayerState = {
      airdropActive: false,
      airdropRadius: 0,
      airdropAlpha: 0,
      cloneX: 0,
      cloneY: 0,
      cloneTargetX: 0,
      cloneTargetY: 0,
      cloneScale: 0
    };

    function resetConceptStates() {
      prismPulse = 0;
      capsuleState.animProgress = 0;
      capsuleState.targetProgress = 0;
      capsuleState.burstT = -1;
      capsuleState.burstFlash = 0;
      cardSlide = 0;
      cardTargetSlide = 0;
      cardStamped = false;
      multiplayerState.airdropActive = false;
      multiplayerState.airdropRadius = 0;
      multiplayerState.airdropAlpha = 0;
    }

    function triggerCurrentAction() {
      if (currentConcept === 1) {
        prismPulse = 1.0;
      } else if (currentConcept === 2) {
        capsuleState.burstT = 0;
        capsuleState.burstFlash = 1.0;
        if (capsuleState.targetProgress > 0.5) {
          capsuleState.targetProgress = 0;
        }
      } else if (currentConcept === 3) {
        cardTargetSlide = cardTargetSlide === 0 ? 1.0 : 0;
        if (cardTargetSlide === 1.0) cardStamped = true;
      } else if (currentConcept === 4) {
        multiplayerState.airdropActive = true;
        multiplayerState.airdropRadius = 8;
        multiplayerState.airdropAlpha = 0.95;
        multiplayerState.cloneX = W * 0.50;
        multiplayerState.cloneY = H * 0.46;
        var destX = pointer.active ? pointer.x : W * 0.35;

        // 顶栏专属色条
        ctx.beginPath();
        drawRoundRect(ctx, -cW * 0.5 + 14, -cH * 0.5 + 14, 28, 5, 2.5);
        ctx.fillStyle = isReplica ? (dark ? '#34D399' : '#10B981') : (dark ? '#F04A8A' : '#122E8A');
        ctx.fill();

        // 卡片标题
        ctx.fillStyle = dark ? '#EEE9E2' : '#2C2824';
        drawRoundRect(ctx, -cW * 0.5 + 14, -cH * 0.5 + 26, cW * 0.65, 8, 4);
        ctx.fill();

        // 笔记段落线
        for (var r = 0; r < 4; r++) {
          var rw = (r === 1) ? cW * 0.55 : cW * 0.72;
          ctx.fillStyle = dark ? 'rgba(255,255,255,0.12)' : 'rgba(106, 102, 96, 0.35)';
          drawRoundRect(ctx, -cW * 0.5 + 14, -cH * 0.5 + 46 + r * 12, rw, 3.5, 1.7);
          ctx.fill();
        }

        // 内嵌书签微卡
        var ncy = -cH * 0.5 + 104;
        var nch = cH - 104 - 32;
        drawRoundRect(ctx, -cW * 0.5 + 12, ncy, cW - 24, nch, 8);
        ctx.fillStyle = dark ? 'rgba(32, 32, 38, 0.9)' : 'rgba(245, 239, 234, 0.8)';
        ctx.fill();
        ctx.strokeStyle = isReplica ? 'rgba(16, 185, 129, 0.35)' : (dark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.06)');
        ctx.lineWidth = 1;
        ctx.stroke();

        // 底部印章
        var bottomText = isReplica ? '✦ FORKED // LOCAL' : 'ORIGIN // 8F2A';
        ctx.font = '700 8.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = isReplica ? (dark ? '#34D399' : '#059669') : (dark ? '#F04A8A' : '#122E8A');
        ctx.fillText(bottomText, -cW * 0.5 + 14, cH * 0.5 - 14);

        ctx.restore();
      }

      // 未抽离时，副本在底层稍微倾斜；抽离后独立展开
      drawCardBody(c2x, c2y, 0.04 - cardSlide * 0.02, true, cardSlide);
      drawCardBody(c1x, c1y, -0.02, false, 1.0);

      // 底部微提示
      ctx.font = '600 9px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = dark ? 'rgba(255,255,255,0.65)' : 'rgba(44,40,36,0.65)';
      var slideText = cardSlide > 0.6
        ? '✦ CARD FORKED: TACTILE MITOSIS COMPLETE (CLICK TO STACK BACK)'
        : '✦ STACKED STATE: CLICK CARD TO TRIGGER TACTILE FORK SLIDE';
      ctx.fillText(slideText, W * 0.5, H * 0.94);
    }

    /* ═══════════════════════════════════════════════════════════
       方案 ④ 渲染引擎：【多端协同光标与隔空投送】(Multiplayer Cursors & Gravitational AirDrop)
       ═══════════════════════════════════════════════════════════ */
    function drawCursorArrow(c, x, y, color, tag, dark) {
      c.save();
      c.translate(x, y);

      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(0, 15);
      c.lineTo(4, 11);
      c.lineTo(9, 15);
      c.lineTo(11, 13);
      c.lineTo(6, 9);
      c.lineTo(12, 9);
      c.closePath();

      c.fillStyle = color;
      c.shadowColor = dark ? 'rgba(0,0,0,0.6)' : 'rgba(44,40,36,0.18)';
      c.shadowBlur = 6;
      c.shadowOffsetY = 2;
      c.fill();
      c.shadowBlur = 0;
      c.shadowOffsetY = 0;

      c.strokeStyle = '#FFFFFF';
      c.lineWidth = 1.2;
      c.stroke();

      if (tag) {
        c.font = '600 8.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
        var tw = c.measureText(tag).width;
        var bx = 12, by = 12;
        var bw = tw + 12, bh = 18;

        c.beginPath();
        drawRoundRect(c, bx, by, bw, bh, 6);
        c.fillStyle = color;
        c.shadowColor = color;
        c.shadowBlur = 8;
        c.fill();
        c.shadowBlur = 0;

        c.fillStyle = '#FFFFFF';
        c.textAlign = 'left';
        c.textBaseline = 'middle';
        c.fillText(tag, bx + 6, by + bh * 0.5);
      }
      c.restore();
    }

    function renderConcept4(time) {
      var dark = isDark();
      var cx = W * 0.50;
      var cy = H * 0.44;
      var cardW = Math.min(220, W * 0.35);
      var cardH = 136;

      var peer1X = cx - cardW * 0.35 + Math.sin(time * 0.9) * 65 + Math.cos(time * 1.5) * 18;
      var peer1Y = cy - 22 + Math.cos(time * 0.8) * 40;

      var peer2X = cx + cardW * 0.38 + Math.cos(time * 0.7) * 55;
      var peer2Y = cy + 24 + Math.sin(time * 1.1) * 36;

      var userX = pointer.active ? pointer.x : (cx - 70 + Math.sin(time * 0.6) * 15);
      var userY = pointer.active ? pointer.y : (cy + 75 + Math.cos(time * 0.6) * 12);

      // 中心公共卡牌
      ctx.save();
      ctx.translate(cx, cy);

      var cardBg = dark ? '#25252B' : '#FDFBF9';
      ctx.beginPath();
      drawRoundRect(ctx, -cardW * 0.5, -cardH * 0.5, cardW, cardH, 14);
      ctx.fillStyle = cardBg;
      ctx.shadowColor = dark ? 'rgba(0,0,0,0.5)' : 'rgba(44,40,36,0.12)';
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      ctx.strokeStyle = dark ? 'rgba(255, 255, 255, 0.2)' : 'rgba(18, 46, 138, 0.25)';
      ctx.lineWidth = 1.3;
      ctx.stroke();

      ctx.beginPath();
      drawRoundRect(ctx, -cardW * 0.5 + 14, -cardH * 0.5 + 14, 30, 5, 2.5);
      ctx.fillStyle = dark ? '#F04A8A' : '#122E8A';
      ctx.fill();

      ctx.fillStyle = dark ? '#EEE9E2' : '#2C2824';
      ctx.font = '700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText('AI 工具链与视觉灵感库', -cardW * 0.5 + 14, -cardH * 0.5 + 26);

      for (var i = 0; i < 3; i++) {
        var iy = -cardH * 0.5 + 48 + i * 16;
        ctx.beginPath();
        ctx.arc(-cardW * 0.5 + 18, iy + 4, 2.2, 0, Math.PI * 2);
        ctx.fillStyle = i === 0 ? '#38BDF8' : (i === 1 ? '#10B981' : '#F43F5E');
        ctx.fill();

        drawRoundRect(ctx, -cardW * 0.5 + 26, iy + 2, (i === 1 ? cardW * 0.5 : cardW * 0.68), 4, 2);
        ctx.fillStyle = dark ? 'rgba(255,255,255,0.12)' : 'rgba(106, 102, 96, 0.3)';
        ctx.fill();
      }

      var by = cardH * 0.5 - 16;
      ctx.font = '700 8.5px ui-monospace, monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = dark ? '#9B968E' : '#6A6660';
      ctx.fillText('PUBLIC // 820 FORKS', -cardW * 0.5 + 14, by);

      ctx.beginPath();
      ctx.arc(cardW * 0.5 - 18, by, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#38BDF8';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cardW * 0.5 - 28, by, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#FB7185';
      ctx.fill();
      ctx.restore();

      // 磁力丝线
      var distToCenter = Math.hypot(userX - cx, userY - cy);
      if (distToCenter < 240) {
        var tetherAlpha = Math.max(0, 1 - distToCenter / 240);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(userX, userY);
        ctx.strokeStyle = dark
          ? 'rgba(52, 211, 153, ' + tetherAlpha * 0.4 + ')'
          : 'rgba(16, 185, 129, ' + tetherAlpha * 0.35 + ')';
        ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // AirDrop 共振波与投送克隆
      if (multiplayerState.airdropActive) {
        multiplayerState.airdropRadius += 4.5;
        multiplayerState.airdropAlpha -= 0.022;

        ctx.beginPath();
        ctx.arc(userX, userY, multiplayerState.airdropRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(16, 185, 129, ' + Math.max(0, multiplayerState.airdropAlpha) + ')';
        ctx.lineWidth = 2.2;
        ctx.stroke();

        multiplayerState.cloneX += (multiplayerState.cloneTargetX - multiplayerState.cloneX) * 0.12;
        multiplayerState.cloneY += (multiplayerState.cloneTargetY - multiplayerState.cloneY) * 0.12;
        multiplayerState.cloneScale = Math.min(1.0, multiplayerState.cloneScale + 0.08);

        ctx.save();
        ctx.translate(multiplayerState.cloneX, multiplayerState.cloneY);
        ctx.scale(multiplayerState.cloneScale, multiplayerState.cloneScale);

        var clW = cardW * 0.78;
        var clH = cardH * 0.78;
        ctx.beginPath();
        drawRoundRect(ctx, -clW * 0.5, -clH * 0.5, clW, clH, 10);
        ctx.fillStyle = dark ? '#222228' : '#FFFFFF';
        ctx.shadowColor = '#10B981';
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = '#10B981';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.font = '700 8.5px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = dark ? '#34D399' : '#059669';
        ctx.fillText('✓ AIRDROP: FORKED TO VAULT', 0, 0);
        ctx.restore();

        if (multiplayerState.airdropAlpha <= 0 && multiplayerState.airdropRadius > 260) {
          multiplayerState.airdropActive = false;
        }
      }

      // 绘制协同光标
      drawCursorArrow(ctx, peer1X, peer1Y, '#38BDF8', 'Alex (Tokyo)', dark);
      drawCursorArrow(ctx, peer2X, peer2Y, '#FB7185', 'Elena (Berlin)', dark);
      drawCursorArrow(ctx, userX, userY, '#10B981', 'You (Local)', dark);

      ctx.font = '600 9px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = dark ? 'rgba(255,255,255,0.65)' : 'rgba(44,40,36,0.65)';
      var hint = multiplayerState.airdropActive
        ? '✦ AIRDROP PULSE: FORKED TO LOCAL VAULT'
        : '✦ MULTIPLAYER AIRDROP: CLICK ANYWHERE TO AIRDROP FORK';
      ctx.fillText(hint, W * 0.5, H * 0.94);
    }

    /* ═══════════════════════════════════════════════════════════
       主渲染循环
       ═══════════════════════════════════════════════════════════ */
    function animate(now) {
      var dt = lastT ? Math.min((now - lastT) / 1000, 0.1) : 0.016;
      lastT = now;
      clock += dt;

      ctx.clearRect(0, 0, W, H);

      if (currentConcept === 1) renderConcept1(clock);
      else if (currentConcept === 2) renderConcept2(clock);
      else if (currentConcept === 3) renderConcept3(clock);
      else if (currentConcept === 4) renderConcept4(clock);

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // 一键设为主站正式视觉
    function applyAsMainVisual(index) {
      try {
        localStorage.setItem('lv_share_concept', String(index));
      } catch (e) {}
      alert('已成功将【' + CONCEPTS_META[index].title + '】设为正式视觉方案！即将返回首页查看。');
      window.location.href = '/?stay=1&concept=' + index + '#create';
    }

    // 初始化
    switchConcept(1);
  </script>
