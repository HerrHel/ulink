<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>与链 - 创作与分享（高定双星提案）</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5EFEA; --text: #111; --surface: #fff; --border: rgba(0,0,0,0.1); --primary: #122E8A; --accent: #10B981;
        }
        [data-theme="dark"] {
            --bg: #0D0D0F; --text: #fff; --surface: #1C1C1F; --border: rgba(255,255,255,0.1); --primary: #10B981; --accent: #38BDF8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); transition: background 0.4s, color 0.4s; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        .header { padding: 1.25rem 2.5rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); z-index: 10; background: var(--bg); }
        .tabs { display: flex; gap: 0.5rem; background: var(--surface); padding: 0.35rem; border-radius: 8px; border: 1px solid var(--border); }
        .tab { padding: 0.5rem 1.5rem; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 500; transition: 0.2s; color: var(--text); opacity: 0.5; }
        .tab.active { background: var(--primary); color: #fff; opacity: 1; }
        [data-theme="dark"] .tab.active { background: var(--surface); color: var(--primary); border: 1px solid var(--border); }
        
        .actions { display: flex; gap: 1rem; align-items: center; }
        .btn { padding: 0.6rem 1.2rem; border-radius: 6px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: 0.2s; background: var(--surface); color: var(--text); border: 1px solid var(--border); }
        .btn:hover { border-color: var(--primary); color: var(--primary); }
        .btn-primary { background: var(--text); color: var(--bg); border: none; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

        .content { flex: 1; position: relative; display: flex; }
        .canvas-container { flex: 1; position: relative; }
        canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
        
        .panel { width: 420px; padding: 3rem 3rem; border-left: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; background: var(--bg); z-index: 10; }
        .badge { display: inline-block; padding: 0.4rem 0.8rem; border-radius: 6px; background: var(--border); color: var(--text); font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; margin-bottom: 1.5rem; align-self: flex-start; }
        h1 { font-size: 2rem; margin-bottom: 1.2rem; line-height: 1.3; font-weight: 600; letter-spacing: -0.5px; }
        p { opacity: 0.75; font-size: 1.05rem; line-height: 1.7; margin-bottom: 2.5rem; }
        
        .meta-list { display: flex; flex-direction: column; gap: 1.5rem; border-top: 1px solid var(--border); padding-top: 2rem; }
        .meta-item { font-size: 0.95rem; line-height: 1.6; }
        .meta-item strong { display: block; margin-bottom: 0.4rem; opacity: 1; font-weight: 600; }
        .meta-item span { opacity: 0.7; }

        .instruction { position: absolute; bottom: 2.5rem; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 0.75rem 2rem; border-radius: 30px; font-size: 0.9rem; font-weight: 500; border: 1px solid var(--border); pointer-events: none; box-shadow: 0 10px 40px rgba(0,0,0,0.15); animation: bounce 2.5s infinite; letter-spacing: 0.5px; transition: opacity 0.5s; }
        @keyframes bounce { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -6px); } }
    </style>
</head>
<body data-theme="dark">

    <div class="header">
        <div class="tabs">
            <div class="tab active" data-concept="1">方案 A：苍穹星网与引力投影</div>
            <div class="tab" data-concept="2">方案 B：神经织链与数据突触</div>
        </div>
        <div class="actions">
            <button class="btn" id="theme-btn">切换明暗主题</button>
            <button class="btn btn-primary" id="apply-btn">采纳并设为默认方案</button>
        </div>
    </div>

    <div class="content">
        <div class="canvas-container">
            <canvas id="visual-canvas"></canvas>
            <div class="instruction">点击画布核心，触发 Fork 链路</div>
        </div>
        <div class="panel" id="info-panel"></div>
    </div>

    <script src="./share-visual.js"></script>
    <script>
        const renderShareVisual = window.renderShareVisual;

        const canvas = document.getElementById('visual-canvas');
        const themeBtn = document.getElementById('theme-btn');
        const applyBtn = document.getElementById('apply-btn');
        const tabs = document.querySelectorAll('.tab');
        const infoPanel = document.getElementById('info-panel');
        const instruction = document.querySelector('.instruction');

        const CONCEPTS = {
            1: {
                badge: 'NATIVE METAPHOR',
                title: '苍穹星网与引力投影',
                desc: '完美呼应与链首页「星系」的宏大意象。原本孤独闪烁的星光，通过一根引力射线的链接，瞬间在你的本地投影出一座同频共振的全息星网。',
                meta: [
                    { label: '核心隐喻', val: '每一组书签都是一个星系，分享与 Fork 就是知识星系的超光速全息投影繁衍。' },
                    { label: '设计美学', val: '深空 3D 拓扑、极简辉光、高能粒子射线，摒弃一切多余UI与边框，只留纯粹的光影呼吸。' }
                ]
            },
            2: {
                badge: 'DATA TOPOLOGY',
                title: '神经织链与数据突触',
                desc: '回归「与链」最纯粹的本质：链。将知识具象化为生生不息的神经中枢与光纤干道；点击瞬间，一道侧向突触极速生长，编织出属于你的崭新链路分支。',
                meta: [
                    { label: '核心隐喻', val: '知识不是死板的文件库，而是如同光纤与神经突触般流转、生长的活体数据链路。' },
                    { label: '设计美学', val: '极度克制的垂直线性几何结构、平滑的贝塞尔生长曲线、微观流动的光子脉冲。' }
                ]
            }
        };

        let currentConcept = '1';
        let visualEngine = null;

        function updateInfo(concept) {
            const data = CONCEPTS[concept];
            infoPanel.innerHTML = `
                <div class="badge">${data.badge}</div>
                <h1>${data.title}</h1>
                <p>${data.desc}</p>
                <div class="meta-list">
                    ${data.meta.map(m => `<div class="meta-item"><strong>${m.label}</strong><span>${m.val}</span></div>`).join('')}
                </div>
            `;
        }

        function mountEngine(concept) {
            if (visualEngine) visualEngine.destroy();
            instruction.style.opacity = '1';
            
            visualEngine = renderShareVisual(canvas, {
                concept: concept,
                onStateChange: (state) => {
                    if (state === 'forking') {
                        instruction.style.opacity = '0';
                    }
                }
            });
            updateInfo(concept);
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentConcept = tab.dataset.concept;
                mountEngine(currentConcept);
            });
        });

        themeBtn.addEventListener('click', () => {
            const current = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        });

        applyBtn.addEventListener('click', () => {
            localStorage.setItem('lv_share_concept', currentConcept);
            window.location.href = `/?stay=1&concept=${currentConcept}#create`;
        });

        mountEngine(currentConcept);
    </script>
</body>
</html>
